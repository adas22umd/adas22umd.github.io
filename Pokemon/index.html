<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

  <div class="pokeball-bg" aria-hidden="true">
    <img src="Pokeball.png" alt="">
  </div>

  <div class="page-wrapper">

    <div class="side-panel side-panel--left">

      <div class="side-card" id="oak-panel">
        <div class="side-card-header">
          <span class="side-card-dot"></span>
          <span class="side-card-title">Oak's Notes</span>
        </div>
        <div class="oak-portrait">
          <img src="ProfOak.png" alt="Professor Oak" class="oak-img">
        </div>
        <div class="side-card-body">
          <p class="oak-text" id="oak-text">Loading Pokédex data…</p>
        </div>
      </div>

      <div class="side-card" id="recent-panel">
        <div class="side-card-header">
          <span class="side-card-dot"></span>
          <span class="side-card-title">Recently Viewed</span>
        </div>
        <div class="side-card-body">
          <div class="recent-list" id="recent-list">
            <span class="side-empty">None yet</span>
          </div>
        </div>
      </div>

    </div>

    <div class="screen-container">
      <div class="screen">
        <img class="pokemon-sprite" id="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Pokemon sprite">
        <div class="main-info" id="main-info">
          <div class="number" id="number">01</div>
          <div class="name" id="name">BULBASAUR</div>
          <div class="typing-all" id="typing-container"></div>
          <div class="desc" id="desc"></div>
        </div>
      </div>

      <div class="search-bar" id="search-bar">
        <input class="search-input" type="text" id="search-input" placeholder="ENTER NAME OR #" maxlength="30">
        <button class="search-btn" onclick="handleSearch()">GO</button>
        <div class="search-dropdown" id="search-dropdown" style="display:none;">
          <div class="dropdown-list" id="dropdown-list"></div>
        </div>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" id="tab-stats" onclick="switchTab('stats')">STATS</button>
        <button class="tab-btn" id="tab-moves" onclick="switchTab('moves')">MOVES</button>
        <button class="tab-btn" id="tab-locations" onclick="switchTab('locations')">MAP</button>
      </div>

      <div class="filter-panel" id="filter-panel">
        <div class="screw screw-tl"></div>
        <div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div>
        <div class="screw screw-br"></div>
        <div class="filter-panel-inner" id="filter-panel-inner">
          <input class="move-filter-input" id="move-filter-input" type="text" placeholder="FILTER MOVES...">
        </div>
      </div>

      <div class="tab-content-wrapper">
        <div class="tab-content" id="tab-content">
          <p class="empty">Loading...</p>
        </div>
      </div>

      <div class="all-btns">
        <button class="left-btn" id="changeleft">◀</button>
        <button class="right-btn" id="changeright">▶</button>
      </div>
    </div>

    <div class="side-panel side-panel--right">

      <div class="side-card" id="evo-panel">
        <div class="side-card-header">
          <span class="side-card-dot"></span>
          <span class="side-card-title">Evolution Chain</span>
        </div>
        <div class="side-card-body">
          <div class="evo-chain" id="evo-chain">
            <span class="side-empty">Loading…</span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <div class="credits">designed and developed by Abhinav Das&nbsp;&nbsp;;)</div>
  <div class="kb-hint">← → pokemon &nbsp;·&nbsp; tab tabs &nbsp;·&nbsp; s search &nbsp;·&nbsp; f filter</div>

</body>
</html>
