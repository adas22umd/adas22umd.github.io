<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex</title>
    <link rel="stylesheet" href = style.css>
    <script src="script.js"></script>
</head>
<body>
    <div class="screen-container">
      <div class="screen">
        <img class="pokemon-sprite" id="sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Pokemon sprite">
        <div class="main-info">
          <div class="number" id="number">01</div>
          <div class="name" id="name">BULBASAUR</div>
          <div class="typing" id="typing">GRASS POISON</div>
        </div>
      </div>
      <btn class = "change" id ="change">CHANGE POKEMON</btn>
    </div>
        

</body>
</html>
