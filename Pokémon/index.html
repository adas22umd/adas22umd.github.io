<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex</title>
</head>
<body>
    <div class="screen-container">
      <div class="screen">
        <img class="pokemon-sprite" id="sprite" src="" alt="Pokemon sprite">
        <div class="pokemon-info">
          <div class="pokemon-number" id="poke-number">#001</div>
          <div class="pokemon-name" id="poke-name">Bulbasaur</div>
          <div class="pokemon-types" id="poke-types"></div>
          <div class="pokemon-flavor" id="poke-flavor">Loading Pokédex data...</div>
        </div>
      </div>
    </div>

    <div class="search-bar">
      <input class="search-input" type="text" id="search-input" placeholder="ENTER NAME OR #" maxlength="30">
      <button class="search-btn" onclick="handleSearch()">GO</button>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" id="tab-stats">STATS</button>
      <button class="tab-btn" id="tab-moves">MOVES</button>
      <button class="tab-btn" id="tab-locations">MAP</button>
    </div>

        <script src="script.js"></script>

</body>
</html>
